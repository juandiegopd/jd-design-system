<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="card-title">Borders — 1px hairlines only</div>
  <div style="display:flex;flex-direction:column;gap:14px">
    <div>
      <div style="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#9A9088;margin-bottom:6px">Card border · 1px solid var(--cream-3)</div>
      <div style="border:1px solid #E0DDD7;border-radius:6px;padding:14px 16px;font-family:'DM Sans',sans-serif;font-size:14px;color:#1C1B19">A card with a hairline border. No shadow.</div>
    </div>
    <div>
      <div style="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#9A9088;margin-bottom:6px">Section divider · 1px solid var(--cream-3)</div>
      <div style="border-top:1px solid #E0DDD7;padding-top:10px;font-family:'DM Sans',sans-serif;font-size:13px;color:#6B6861">Hairlines separate sections instead of shadows.</div>
    </div>
  </div>
</div>
</body></html>
