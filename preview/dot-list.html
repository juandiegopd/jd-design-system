<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="card-title">Dot list — the signature bullet</div>
  <div style="display:flex;gap:32px;border-top:1px solid #E0DDD7;padding-top:14px;flex-wrap:wrap">
    <div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#1C1B19;display:flex;align-items:center;gap:8px">
      <span style="width:5px;height:5px;border-radius:50%;background:#1C1B19"></span>Experience
    </div>
    <div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#9A9088;display:flex;align-items:center;gap:8px">
      <span style="width:5px;height:5px;border-radius:50%;background:#E0DDD7"></span>Writing
    </div>
    <div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#9A9088;display:flex;align-items:center;gap:8px">
      <span style="width:5px;height:5px;border-radius:50%;background:#E0DDD7"></span>Projects
    </div>
    <div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#9A9088;display:flex;align-items:center;gap:8px">
      <span style="width:5px;height:5px;border-radius:50%;background:#E0DDD7"></span>Playbooks
    </div>
  </div>
  <div style="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#9A9088;margin-top:16px">
    Active item gets ink dot · inactive gets cream-3
  </div>
</div>
</body></html>
