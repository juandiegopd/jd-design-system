<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.btn{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;padding:10px 18px;border-radius:6px;cursor:pointer;border:1px solid transparent;transition:all 200ms cubic-bezier(.2,.6,.2,1)}
.btn-primary{background:#1C1B19;color:#F8F7F4}
.btn-primary:hover{background:#4A4641}
.btn-secondary{background:transparent;color:#1C1B19;border-color:#E0DDD7}
.btn-secondary:hover{background:#EFEDE8}
.btn-ghost{background:transparent;color:#4A4641}
.btn-ghost:hover{color:#1C1B19;background:#EFEDE8}
.btn-link{background:transparent;color:#1B4DD8;padding:10px 0;text-decoration:underline;text-underline-offset:3px}
</style></head><body>
<div class="card">
  <div class="card-title">Buttons</div>
  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <button class="btn btn-primary">Read the playbook</button>
    <button class="btn btn-secondary">View projects</button>
    <button class="btn btn-ghost">Cancel</button>
    <a class="btn btn-link" href="#">Read more →</a>
  </div>
  <div style="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#9A9088;margin-top:16px">
    primary · secondary · ghost · link
  </div>
</div>
</body></html>
