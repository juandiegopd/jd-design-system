<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="card-title">Form inputs</div>
  <div style="display:flex;flex-direction:column;gap:14px;max-width:380px">
    <div>
      <label style="display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#6B6861;margin-bottom:6px">Email</label>
      <input value="you@company.com" style="width:100%;font-family:'DM Sans',sans-serif;font-size:14px;color:#1C1B19;padding:10px 12px;border:1px solid #E0DDD7;background:#F8F7F4;border-radius:3px;outline:none">
    </div>
    <div>
      <label style="display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#6B6861;margin-bottom:6px">Message</label>
      <input placeholder="Say hi…" style="width:100%;font-family:'DM Sans',sans-serif;font-size:14px;color:#9A9088;padding:10px 12px;border:1px solid #1C1B19;background:#F8F7F4;border-radius:3px;outline:none">
      <div style="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:#9A9088;margin-top:4px">Focus state · 1px ink border</div>
    </div>
  </div>
</div>
</body></html>
