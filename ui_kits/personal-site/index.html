<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>juandiego.work — UI kit</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="HomeHero.jsx"></script>
<script type="text/babel" src="PostList.jsx"></script>
<script type="text/babel" src="PostView.jsx"></script>
<script type="text/babel" src="ProjectList.jsx"></script>
<script type="text/babel" src="CompanyLanding.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState } = React;

function App() {
  const [route, setRoute] = useState({ page: 'home' });

  const nav = (page, postId) => setRoute({ page, postId });

  return (
    <div className="app" data-screen-label={'JD Site — ' + route.page}>
      <Nav active={route.page === 'post' ? 'writing' : route.page} onNav={(p)=>nav(p)} />
      {route.page === 'home'     && <HomeHero onNav={nav} />}
      {route.page === 'writing'  && <PostList onOpen={(id)=>nav('post', id)} />}
      {route.page === 'post'     && <PostView id={route.postId} onBack={()=>nav('writing')} />}
      {route.page === 'projects' && <ProjectList />}
      {route.page === 'company'  && <CompanyLanding />}
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
